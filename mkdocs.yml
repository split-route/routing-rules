site_name: Routing Rules
site_description: "Daily-built routing rules and ready-made configs for proxy and VPN clients: direct routing for domestic sites and IP ranges (currently Iran), and blocking of ads, trackers, malware, phishing and cryptominers."
site_url: https://split-route.github.io/routing-rules/
repo_url: https://github.com/split-route/routing-rules
repo_name: split-route/routing-rules
edit_uri: edit/main/docs/
copyright: Code GPL-3.0 · Lists keep their upstream licenses · IP geolocation by <a href="https://db-ip.com">DB-IP</a>
docs_dir: docs
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - navigation.path
    - content.tooltips
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    admonition:
      note: material/information-outline
      warning: material/alert-outline
      tip: material/lightbulb-on-outline

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/split-route/routing-rules
      name: Source on GitHub
    - icon: material/download
      link: https://github.com/split-route/routing-rules/releases/latest
      name: Latest release

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/check-i18n.js
  - assets/check.js

nav:
  - Home: index.md
  - Cores:
      - sing-box: sing-box.md
      - Clash / mihomo: clash.md
      - v2ray / Xray: v2ray.md
  - Apps:
      - Shadowrocket: shadowrocket.md
      - Surge & Loon: surge-loon.md
      - Karing: karing.md
      - v2rayN / v2rayNG: v2rayn.md
  - More:
      - WireGuard, OpenVPN & routers: networks.md
      - macOS & Linux (splitroute): splitroute.md
      - Browsers (PAC): pac.md
      - AdGuard Home & Pi-hole: dns-filters.md
  - Check a domain: check.md
  - Reference:
      - File URLs: urls.md
      - Sources and licenses: sources.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  # docs/<locale>/ per language; pages missing in a language fall back to English
  # (the generated File URLs and Sources pages exist only in docs/en).
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fa
          name: فارسی
          build: true
          site_name: قوانین مسیریابی
          site_description: "قوانین مسیریابی و کانفیگ‌های آماده برای کلاینت‌های پراکسی و VPN که هر روز آپدیت می‌شوند: اتصال مستقیم برای سایت‌ها و بازه‌های IP داخلی (فعلاً ایران) و مسدودسازی تبلیغات، ردیاب‌ها، بدافزار، فیشینگ و استخراج‌کننده‌های رمزارز."
          copyright: کد تحت مجوز GPL-3.0 · لیست‌ها مجوز منبع اصلی خود را دارند · مکان‌یابی IP از <a href="https://db-ip.com">DB-IP</a>
          theme:
            font:
              text: Vazirmatn
          nav_translations:
            Home: خانه
            Cores: هسته‌ها
            Apps: برنامه‌ها
            Surge & Loon: Surge و Loon
            More: بیشتر
            WireGuard, OpenVPN & routers: WireGuard، OpenVPN و روترها
            macOS & Linux (splitroute): macOS و Linux (splitroute)
            Browsers (PAC): مرورگرها (PAC)
            AdGuard Home & Pi-hole: AdGuard Home و Pi-hole
            Check a domain: بررسی دامنه
            Reference: مرجع
            File URLs: لینک فایل‌ها
            Sources and licenses: منابع و مجوزها
