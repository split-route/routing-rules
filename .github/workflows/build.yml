name: build

on:
  schedule:
    - cron: "00 03 * * *"
  workflow_dispatch:
  # PRs (e.g. Renovate updates) run the build and every check, but never publish.
  pull_request:
  push:
    branches: [ main ]
    paths:
      - "cmd/**"
      - "internal/**"
      - "sources.yaml"
      - "data/**"
      - "scripts/**"
      - "go.mod"
      - "go.sum"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: write # publish GitHub releases
  pages: write
  id-token: write # Pages deploy and build provenance attestations
  attestations: write

env:
  # Identity for the release-branch commit and the keepalive commit. GitHub links
  # a commit to an account by email; this address belongs to no account.
  BOT_NAME: routing-rules-bot
  BOT_EMAIL: routing-rules-bot@users.noreply.github.com
  # Pinned tools that compile and validate the outputs. Renovate bumps these
  # versions; downloads are verified against the SHA-256 digest GitHub publishes
  # for each release asset.
  # renovate: datasource=github-releases depName=SagerNet/sing-box
  SING_BOX_VERSION: 1.14.4
  # renovate: datasource=github-releases depName=XTLS/Xray-core
  XRAY_VERSION: 26.11.9
  # renovate: datasource=github-releases depName=MetaCubeX/mihomo
  MIHOMO_VERSION: 1.19.34

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false # never kill a run mid-push

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # HTTP ETag cache + per-source last-known-good. Unique key per run so the
      # cache is saved every time; restore-keys picks the most recent one.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      # Checksums of the latest release: what users download right now.
      - name: Fetch previous checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          gh release download --pattern SHA256SUMS --pattern '*.list' --dir "$RUNNER_TEMP/prev" \
            || echo "No previous release files; this run publishes a new release."

      - run: go test ./...

      - name: Build
        run: go run ./cmd/build

      - name: Cache sing-box, Xray and mihomo
        id: tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin
          key: tools-${{ runner.os }}-sing-box-${{ env.SING_BOX_VERSION }}-xray-${{ env.XRAY_VERSION }}-mihomo-${{ env.MIHOMO_VERSION }}

      - name: Install sing-box, Xray and mihomo
        if: steps.tools.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-tools.sh "$RUNNER_TEMP/bin"

      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Compile rule-sets
        run: scripts/compile.sh

      - name: Check configs with sing-box, Xray and mihomo
        run: scripts/check-configs.sh

      - name: Check known answers in the compiled files
        run: go run ./cmd/verify

      - name: Assemble release files
        id: assemble
        run: |
          rel="$RUNNER_TEMP/release"
          mkdir -p "$rel"
          cp dist/* out/geosite.dat out/geoip.dat out/srs/*.srs out/mrs/*.mrs "$rel/"
          echo "release files: $(ls "$rel" | wc -l), $(du -sm "$rel" | cut -f1) MB"
          # Outputs are deterministic, so unchanged sources give identical checksums.
          (cd "$rel" && sha256sum -- * | sort -k2) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" "$rel/SHA256SUMS"
          if cmp -s "$rel/SHA256SUMS" "$RUNNER_TEMP/prev/SHA256SUMS"; then
            echo "No changes since the latest release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "REL=$rel" >> "$GITHUB_ENV"

      # A new release per change: created as a draft, filled, then published, so
      # .../releases/latest/download/<file> switches to the new set at once and
      # never serves a half-uploaded release. Older releases are deleted.
      # Signed build provenance for every release file: verify one with
      # `gh attestation verify <file> --repo split-route/routing-rules`.
      - name: Attest release files
        if: steps.assemble.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.REL }}/*

      - name: Publish GitHub release
        if: steps.assemble.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh "$RUNNER_TEMP/prev"

      # The release set plus every upstream geosite and geoip rule-set, on one force-pushed commit.
      - name: Publish release branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-branch.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Build docs
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install -q -r requirements-docs.txt
          mkdocs build --strict                         # English at site/, Persian at site/fa/ (mkdocs-static-i18n)
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  pages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and this workflow never commits to main. Push an empty commit
  # when main has been quiet for 50 days.
  keepalive:
    if: always() && github.event_name == 'schedule' # also when the build fails for days
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "$BOT_NAME"
            git config user.email "$BOT_EMAIL"
            git commit --allow-empty -m "chore: keep scheduled workflow enabled"
            git push
          fi
