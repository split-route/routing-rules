# Source registry for cmd/build. file:/// URLs are read from the repo root.
# Every remote URL below was fetched and its format
# checked on 2026-11-16 unless it is enabled: false with a TODO.
#
# format:  hosts | domains | abp | v2fly | cidr | json | dbip-csv
# match:   suffix | exact  (hosts/domains only; how plain domains become rules)
# filter:  json only; skip objects whose key has a different value
# Rule order decides overlaps: REJECT lists come before ir-domains in every config, so a
# domain in both is blocked. A bad ad list can block an Iranian site; pin real sites in
# data/allowlist.txt.
# allow_tld: keep single-label names ("lan", "localhost"); only for special-use TLD lists.
# url:     {YYYY-MM} is replaced by the current UTC month (previous month as fallback).

settings:
  user_agent: "routing-rules-builder/1.0 (+https://github.com/split-route/routing-rules)"
  repo_url: https://github.com/split-route/routing-rules
  # Rule-set URLs written into the configs. Files are published as assets of the latest
  # GitHub release; this URL always redirects to the newest copy.
  base_url: https://github.com/split-route/routing-rules/releases/latest/download
  timeout: 90s
  concurrency: 16
  retries: 3
  max_bytes: 67108864        # per-source default size cap (64 MiB)
  list_cap_warn: 200000      # warn above this many rules in one list (iOS NE memory)

# Order matters: REJECT rule-sets appear in the config in this order.
categories:
  - {name: ir-injected,  action: reject, enabled: true}  # rejected before the private rule
  - {name: private,      action: direct, enabled: true}  # local names and ranges, direct before all other rules
  - {name: malware,      action: reject, enabled: true}
  - {name: phishing,     action: reject, enabled: true}
  - {name: cryptominers, action: reject, enabled: true}
  - {name: ads,          action: reject, enabled: true}
  - {name: sanctioned,   action: proxy,  enabled: true}
  - {name: ir-domains,   action: direct, enabled: true}
  - {name: ir-cidr,      action: direct, enabled: true}
  # Optional lists: built and published, not referenced by shadowrocket.conf.
  - {name: social,       action: none,   enabled: true}
  - {name: nsfw,         action: none,   enabled: true}
  - {name: tracking,     action: none,   enabled: true}
  - {name: ads-lite,     action: none,   enabled: true}  # small ads list for memory-limited devices
  - {name: arvancloud,   action: none,   enabled: true}  # Iranian CDNs, including their servers abroad (not in ir-cidr)
  - {name: parspack,     action: none,   enabled: true}
  - {name: derak,        action: none,   enabled: true}
  - {name: cloudflare,   action: none,   enabled: true}
  - {name: cloudfront,   action: none,   enabled: true}
  - {name: fastly,       action: none,   enabled: true}
  - {name: gcore,        action: none,   enabled: true}
  - {name: telegram,     action: none,   enabled: true}
  - {name: tor-exit,     action: none,   enabled: true}
  - {name: netflix,      action: none,   enabled: true}

sources:
  # ---------- Iran domains ----------
  - name: bootmortis-domains
    url: https://github.com/bootmortis/iran-hosted-domains/releases/latest/download/surge_domainset_other.txt
    format: domains
    match: suffix
    category: ir-domains
    enabled: true
    license: MIT (bootmortis/iran-hosted-domains)
    # "other" excludes bootmortis' ads category (domains.txt mixes both; ad networks
    # belong in ads.list, not DIRECT).
  - name: v2fly-category-ir
    url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-ir
    format: v2fly
    skip_includes: [category-ads-ir]
    category: ir-domains
    enabled: true
    license: MIT (v2fly/domain-list-community)
    # data/ir does not exist upstream (404); category-ir includes all *-ir sub-lists.
    # category-ads-ir is skipped: ad networks belong in ads.list, not DIRECT.

  # ---------- Iran IPs ----------
  - name: ripestat-ir
    url: https://stat.ripe.net/data/country-resource-list/data.json?resource=IR
    format: json
    category: ir-cidr
    enabled: true
    license: RIPEstat Data API terms (RIPE NCC)
  - name: v2fly-private
    url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/private
    format: v2fly
    category: private
    allow_tld: true
    enabled: true
    license: MIT (v2fly/domain-list-community)
    # Special-use TLDs (lan, local, localhost, home.arpa, internal…), reverse zones of
    # private ranges, and router/LAN service domains. regexp: entries are skipped.
  - name: private-ips
    url: file:///data/private.txt
    format: cidr
    category: private
    enabled: true
    license: This repository (IANA special-purpose address registries)
  - name: ir-injected
    url: file:///data/ir-injected.txt
    format: cidr
    category: ir-injected
    enabled: true
    license: This repository (values from Chocolate4U/Iran-v2ray-rules)
  - name: dbip-lite-ir
    url: https://download.db-ip.com/free/dbip-country-lite-{YYYY-MM}.csv.gz
    format: dbip-csv
    country: IR
    category: ir-cidr
    enabled: true
    license: CC BY 4.0 (DB-IP Lite; attribution "IP Geolocation by DB-IP" with a link to https://db-ip.com required)
    # Monthly file: {YYYY-MM} is the current UTC month, falling back to the previous month.
    # Geolocation-based (where ranges are used), unlike the registry-based sources above.

  # ---------- Iranian CDN lists (optional) ----------
  # Not sources of ir-cidr: the feeds include edge servers abroad (Vultr, Hetzner,
  # DigitalOcean, CDN77) that must not go DIRECT. Their Iranian ranges are already
  # in ripestat-ir / dbip-lite-ir.
  - name: arvancloud-list
    url: https://www.arvancloud.ir/en/ips.txt
    format: cidr
    category: arvancloud
    enabled: true
    license: Published by ArvanCloud, no license stated
    # /en/dev/ips is a JS-rendered page with no CIDRs in the HTML; ips.txt is the raw feed.
  - name: parspack-list
    url: https://parspack.com/cdnips.txt
    format: cidr
    category: parspack
    enabled: true
    license: Published by ParsPack, no license stated
  - name: derak-list-v4
    url: https://api.derak.cloud/public/ipv4
    format: cidr
    category: derak
    enabled: true
    license: Published by Derak Cloud, no license stated
  - name: derak-list-v6
    url: https://api.derak.cloud/public/ipv6
    format: cidr
    category: derak
    enabled: true
    license: Published by Derak Cloud, no license stated

  # ---------- Ads lite (optional): curated small sources only, ~5k rules ----------
  - name: lite-persianblocker
    url: https://raw.githubusercontent.com/MasterKia/PersianBlocker/main/PersianBlockerHosts.txt
    format: domains
    match: exact
    category: ads-lite
    enabled: true
    license: AGPL-3.0 (MasterKia/PersianBlocker)
  - name: lite-persianblocker-trackers
    url: https://raw.githubusercontent.com/MasterKia/PersianBlocker/main/PersianBlockerTrackers-Domains.txt
    format: domains
    match: suffix
    category: ads-lite
    enabled: true
    license: AGPL-3.0 (MasterKia/PersianBlocker)
  - name: lite-local-ir-ads
    url: file:///data/ir-ads.txt
    format: domains
    match: suffix
    category: ads-lite
    enabled: true
    license: This repository
  - name: lite-peterlowe
    url: https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=1&mimetype=plaintext
    format: hosts
    match: exact
    category: ads-lite
    enabled: true
    license: Peter Lowe's ad server list (pgl.yoyo.org); no explicit license stated
  - name: lite-v2fly-category-ads-all
    url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-ads-all
    format: v2fly
    category: ads-lite
    enabled: true
    license: MIT (v2fly/domain-list-community)

  # ---------- Ads ----------
  - name: persianblocker
    url: https://raw.githubusercontent.com/MasterKia/PersianBlocker/main/PersianBlockerHosts.txt
    format: domains  # despite the name, the file is one domain per line
    match: exact
    category: ads
    enabled: true
    license: AGPL-3.0 (MasterKia/PersianBlocker)
  - name: local-ir-ads
    url: file:///data/ir-ads.txt
    format: domains
    match: suffix
    category: ads
    enabled: true
    license: This repository
    # Iranian ad networks that no trusted upstream list covers; maintained by hand.
  - name: bootmortis-ads
    url: https://github.com/bootmortis/iran-hosted-domains/releases/latest/download/surge_domainset_ads.txt
    format: domains
    match: suffix
    category: ads
    enabled: true
    license: MIT (bootmortis/iran-hosted-domains)
    # This category also tags some real sites (shops, magazines, payment links);
    # those are pinned in allowlist.txt so they are never blocked.
  - name: persianblocker-trackers
    url: https://raw.githubusercontent.com/MasterKia/PersianBlocker/main/PersianBlockerTrackers-Domains.txt
    format: domains
    match: suffix
    category: ads
    enabled: true
    license: AGPL-3.0 (MasterKia/PersianBlocker)
    # Iranian analytics/tracking hosts. Web trackers belong with ads (blocked by
    # default); device/OS telemetry goes in the optional tracking list.
  - name: hagezi-normal
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/multi-onlydomains.txt
    format: domains
    match: suffix
    category: ads
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Multi NORMAL: fewer false positives than Pro. There is no size-optimized "mini" version
    # of it, so it is larger than pro.mini (~184k vs ~103k entries).
  - name: goodbyeads
    url: https://raw.githubusercontent.com/jerryn70/GoodbyeAds/master/Hosts/GoodbyeAds.txt
    format: hosts
    match: exact
    category: ads
    enabled: false
    license: MIT (jerryn70/GoodbyeAds)
    # Disabled by default: adds ~200k exact hosts and pushes ads.list past the iOS memory budget.
  - name: adguard-sdns
    url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
    format: abp
    category: ads
    enabled: false
    license: GPL-3.0 (AdguardTeam/AdGuardSDNSFilter)
    # Disabled by default: ~190k rules, ads.list grows to ~257k rules / 8.9 MB (over list_cap_warn).
    # hagezi already aggregates AdGuard's DNS filter among its sources.
  - name: peterlowe
    url: https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=1&mimetype=plaintext
    format: hosts
    match: exact
    category: ads
    enabled: true
    license: Peter Lowe's ad server list (pgl.yoyo.org); no explicit license stated
    # Small, hand-curated, low false-positive list; adds ~1.7k hosts not in the other sources.
  - name: easylist
    url: https://easylist.to/easylist/easylist.txt
    format: abp
    category: ads
    enabled: false
    license: GPL-3.0 or CC BY-SA 3.0 (EasyList)
    # Disabled by default: adds ~26k domains (+25% to ads.list), mostly short-lived ad redirect hosts.
  - name: danpollock
    url: https://someonewhocares.org/hosts/hosts
    format: hosts
    match: exact
    category: ads
    enabled: false
    license: Dan Pollock's hosts (someonewhocares.org); free for personal use
    # Disabled by default: adds ~9k hosts, older list with more false positives.
  - name: v2fly-category-ads-all
    url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-ads-all
    format: v2fly
    category: ads
    enabled: true
    license: MIT (v2fly/domain-list-community)

  # ---------- Malware ----------
  - name: urlhaus-hosts
    url: https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-hosts.txt
    format: hosts
    match: exact
    category: malware
    enabled: true
    license: URLhaus data CC0 via malware-filter/urlhaus-filter (MIT)
    # urlhaus.abuse.ch/downloads/hostfile/ now returns 410 Gone; malware-filter mirrors the URLhaus API.
  - name: urlhaus-ips
    url: https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-dnscrypt-blocked-ips-online.txt
    format: cidr
    category: malware
    enabled: true
    license: URLhaus data CC0 via malware-filter/urlhaus-filter (MIT)

  # ---------- Phishing ----------
  - name: phishing-filter-hosts
    url: https://malware-filter.gitlab.io/malware-filter/phishing-filter-hosts.txt
    format: hosts
    match: exact
    category: phishing
    enabled: true
    license: malware-filter/phishing-filter (MIT code; upstream feeds under their own terms)
  - name: phishing-filter-ips
    url: https://malware-filter.gitlab.io/malware-filter/phishing-filter-dnscrypt-blocked-ips.txt
    format: cidr
    category: phishing
    enabled: true
    license: malware-filter/phishing-filter (MIT code; upstream feeds under their own terms)

  # ---------- Cryptominers ----------
  - name: nocoin
    url: https://raw.githubusercontent.com/hoshsadiq/adblock-nocoin-list/master/nocoin.txt
    format: abp
    category: cryptominers
    enabled: true
    license: MIT (hoshsadiq/adblock-nocoin-list)

  # ---------- Social / NSFW (optional) ----------
  - name: stevenblack-social
    url: https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/social-only/hosts
    format: hosts
    match: exact
    category: social
    enabled: true
    license: MIT (StevenBlack/hosts)
  - name: v2fly-category-social-media-non-cn
    url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-social-media-!cn
    format: v2fly
    category: social
    enabled: true
    license: MIT (v2fly/domain-list-community)
  - name: stevenblack-porn
    url: https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn-only/hosts
    format: hosts
    match: exact
    category: nsfw
    enabled: true
    license: MIT (StevenBlack/hosts)
  - name: v2fly-category-porn
    url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-porn
    format: v2fly
    category: nsfw
    enabled: true
    license: MIT (v2fly/domain-list-community)

  # ---------- Device and OS telemetry (optional "tracking" list) ----------
  # Not in the default configs: blocking vendor telemetry can break features (cloud sync,
  # app stores, some app functions), which users can't easily diagnose.
  - name: windowsspyblocker-spy
    url: https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
    format: hosts
    match: exact
    category: tracking
    enabled: true
    license: MIT (crazy-max/WindowsSpyBlocker)
    # Only the "spy" list: "update" and "extra" block Windows Update and other functionality.
  - name: hagezi-native-amazon
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.amazon-onlydomains.txt
    format: domains
    match: suffix
    category: tracking
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Native tracking/telemetry of Amazon devices (Fire TV, Echo).
  - name: hagezi-native-apple
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.apple-onlydomains.txt
    format: domains
    match: suffix
    category: tracking
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Native tracking/telemetry of Apple devices.
  - name: hagezi-native-huawei
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.huawei-onlydomains.txt
    format: domains
    match: suffix
    category: tracking
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Native tracking/telemetry of Huawei devices.
  - name: hagezi-native-lgwebos
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.lgwebos-onlydomains.txt
    format: domains
    match: suffix
    category: tracking
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Native tracking/telemetry of LG webOS TVs.
  - name: hagezi-native-roku
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.roku-onlydomains.txt
    format: domains
    match: suffix
    category: tracking
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Native tracking/telemetry of Roku devices.
  - name: hagezi-native-samsung
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.samsung-onlydomains.txt
    format: domains
    match: suffix
    category: tracking
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Native tracking/telemetry of Samsung devices.
  - name: hagezi-native-tiktok
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.tiktok-onlydomains.txt
    format: domains
    match: suffix
    category: tracking
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Native tracking/telemetry of TikTok.
  - name: hagezi-native-vivo
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.vivo-onlydomains.txt
    format: domains
    match: suffix
    category: tracking
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Native tracking/telemetry of Vivo devices.
  - name: hagezi-native-winoffice
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.winoffice-onlydomains.txt
    format: domains
    match: suffix
    category: tracking
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Native tracking/telemetry of Windows and Office.
  - name: hagezi-native-xiaomi
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.xiaomi-onlydomains.txt
    format: domains
    match: suffix
    category: tracking
    enabled: true
    license: GPL-3.0 (hagezi/dns-blocklists)
    # Native tracking/telemetry of Xiaomi devices.

  # ---------- Sanctioned (domains that block Iranian IPs) ----------
  - name: dynx-antiban
    url: https://raw.githubusercontent.com/MrDevAnony/DynX-AntiBan-Domains/main/DynX-AntiBan-list.lst
    format: domains
    match: suffix
    category: sanctioned
    enabled: true
    license: MIT (MrDevAnony/DynX-AntiBan-Domains)
  - name: filteryab-sanctioned
    url: https://raw.githubusercontent.com/filteryab/ir-sanctioned-domain/main/data/ir-sanctioned-domain
    format: domains
    match: suffix
    category: sanctioned
    enabled: true
    license: No license file upstream (filteryab/ir-sanctioned-domain); attribution given

  # ---------- Provider IP ranges (optional) ----------
  - name: cloudflare-v4
    url: https://www.cloudflare.com/ips-v4
    format: cidr
    category: cloudflare
    enabled: true
    license: Published by Cloudflare
  - name: cloudflare-v6
    url: https://www.cloudflare.com/ips-v6
    format: cidr
    category: cloudflare
    enabled: true
    license: Published by Cloudflare
  - name: aws-cloudfront
    url: https://ip-ranges.amazonaws.com/ip-ranges.json
    format: json
    filter: {service: CLOUDFRONT}
    category: cloudfront
    enabled: true
    license: Published by AWS
  - name: fastly
    url: https://api.fastly.com/public-ip-list
    format: json
    category: fastly
    enabled: true
    license: Published by Fastly
  - name: gcore
    url: https://api.gcore.com/cdn/public-ip-list
    format: json
    category: gcore
    enabled: true
    license: Published by G-Core Labs
  - name: telegram
    url: https://core.telegram.org/resources/cidr.txt
